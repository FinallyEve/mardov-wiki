<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mardov Campaign Timeline</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    /* Character colors */
    --brigit: #e06030;
    --sprocket: #9b59b6;
    --varis: #2ecc71;
    --bergs: #e67e22;
    --nocturnus: #607d8b;
    --fen: #1abc9c;
    --daina: #c0392b;
    --josh: #f1c40f;
    --tiberious: #3498db;
    --stalwart: #e74c3c;
    --randall: #e91e63;
    --tesca: #9c27b0;
    --nyx: #ff5722;
    --irethia: #ffeb3b;
    /* Faction colors */
    --tieflings: #d4537a;
    --dwarves: #b87333;
    --all-party: #58a6ff;
    --endgame: #c9a32e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ---- HEADER ---- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
  }

  header h1 span { color: var(--accent); }

  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    padding: 4px 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .filter-btn.active { border-color: currentColor; color: var(--text); }
  .filter-btn[data-type="character"].active { background: currentColor; color: var(--bg); font-weight: 600; }

  .search-box {
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    width: 200px;
  }

  .search-box::placeholder { color: var(--text-dim); }

  /* ---- LAYOUT ---- */
  .layout {
    display: flex;
    height: calc(100vh - 60px);
  }

  /* ---- SIDEBAR ---- */
  .sidebar {
    width: 240px;
    min-width: 240px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 12px 0;
  }

  .sidebar h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    padding: 8px 16px 4px;
  }

  .char-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.1s;
    user-select: none;
  }

  .char-toggle:hover { background: rgba(255,255,255,0.04); }

  .char-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .char-toggle.off { opacity: 0.35; }
  .char-toggle.off .char-dot { background: var(--text-dim) !important; }

  .char-status {
    font-size: 10px;
    color: var(--text-dim);
    margin-left: auto;
    white-space: nowrap;
  }

  /* ---- MAIN TIMELINE ---- */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    scroll-behavior: smooth;
  }

  /* Act headers */
  .act-header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 12px 0 8px;
    margin-bottom: 8px;
    border-bottom: 2px solid var(--border);
    background: var(--bg);
  }

  .act-header h2 {
    font-size: 16px;
    font-weight: 600;
  }

  .act-header .act-range {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* Event row */
  .event-row {
    display: flex;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    transition: opacity 0.2s, background 0.15s;
    cursor: pointer;
    border-radius: 6px;
    margin: 2px -8px;
    padding-left: 8px;
    padding-right: 8px;
  }

  .event-row:hover { background: rgba(255,255,255,0.03); }
  .event-row.dimmed { opacity: 0.15; }
  .event-row.highlight { background: rgba(88,166,255,0.08); }

  .event-chapter {
    width: 56px;
    min-width: 56px;
    text-align: right;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    padding-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .event-dots {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 16px;
    min-width: 16px;
    position: relative;
  }

  .event-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg);
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }

  .event-dot.major {
    width: 16px;
    height: 16px;
    border-width: 3px;
  }

  .event-line {
    width: 2px;
    flex: 1;
    background: var(--border);
    margin: -2px 0;
  }

  .event-body { flex: 1; min-width: 0; }

  .event-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
  }

  .event-detail {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    line-height: 1.4;
    display: none;
  }

  .event-row.expanded .event-detail { display: block; }

  .event-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .event-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    border: 1px solid;
    opacity: 0.8;
  }

  /* ---- DETAIL PANEL ---- */
  .detail-panel {
    width: 340px;
    min-width: 340px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 20px;
    display: none;
  }

  .detail-panel.open { display: block; }

  .detail-panel h3 {
    font-size: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .detail-panel .close-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
  }

  .detail-section {
    margin-bottom: 16px;
  }

  .detail-section h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .detail-section p, .detail-section li {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }

  .detail-section ul {
    list-style: none;
    padding: 0;
  }

  .detail-section li {
    padding: 2px 0;
    padding-left: 12px;
    position: relative;
  }

  .detail-section li::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    position: absolute;
    left: 0;
    top: 8px;
  }

  .char-arc-bar {
    height: 6px;
    border-radius: 3px;
    margin: 4px 0;
    position: relative;
  }

  .char-arc-label {
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
  }

  /* ---- MINI MAP ---- */
  .minimap {
    position: fixed;
    right: 8px;
    top: 72px;
    width: 6px;
    height: calc(100vh - 80px);
    background: rgba(48,54,61,0.5);
    border-radius: 3px;
    z-index: 50;
  }

  .minimap-thumb {
    width: 6px;
    height: 40px;
    background: var(--accent);
    border-radius: 3px;
    opacity: 0.5;
    position: absolute;
    top: 0;
    transition: top 0.1s;
  }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .detail-panel { position: fixed; right: 0; top: 60px; height: calc(100vh - 60px); z-index: 90; box-shadow: -4px 0 20px rgba(0,0,0,0.5); }
  }

  /* ---- TOOLTIP ---- */
  .tooltip {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    max-width: 320px;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .tooltip.show { opacity: 1; }

  .tooltip-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .tooltip-chapter { color: var(--text-dim); font-size: 11px; }

  /* Jump nav */
  .jump-nav {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }

  .jump-btn {
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
  }

  .jump-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Legend */
  .legend {
    display: flex;
    gap: 16px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface);
    flex-wrap: wrap;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .legend-line {
    width: 20px;
    height: 3px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<header>
  <h1><span>Mardov</span> Campaign Timeline</h1>
  <div class="controls">
    <button class="filter-btn active" data-act="all">All Acts</button>
    <button class="filter-btn" data-act="ancient">Ancient</button>
    <button class="filter-btn" data-act="recent">Recent Past</button>
    <button class="filter-btn" data-act="1">Act 1</button>
    <button class="filter-btn" data-act="2">Act 2</button>
    <button class="filter-btn" data-act="3">Act 3</button>
    <button class="filter-btn" data-act="4">Act 4</button>
    <input type="text" class="search-box" placeholder="Search events..." id="searchBox">
  </div>
  <div class="jump-nav">
    <button class="jump-btn" data-jump="split">The Split</button>
    <button class="jump-btn" data-jump="reunion">Reunion</button>
    <button class="jump-btn" data-jump="stone-table">Stone Table</button>
    <button class="jump-btn" data-jump="asmodeus">Asmodeus</button>
  </div>
</header>

<div class="legend">
  <span style="color:var(--text-dim)">Tracks:</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--all-party)"></span> All Party</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--tieflings)"></span> Tieflings</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--dwarves)"></span> Dwarves</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--endgame)"></span> Endgame</span>
  <span style="margin-left:12px; color:var(--text-dim)">Dot size = significance</span>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="timeline"></main>
  <aside class="detail-panel" id="detailPanel">
    <h3 id="detailTitle"><button class="close-btn" id="closeDetail">&times;</button></h3>
    <div id="detailBody"></div>
  </aside>
</div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-title" id="tooltipTitle"></div>
  <div class="tooltip-chapter" id="tooltipChapter"></div>
</div>

<script>

  sprocket:   { name: "Sprocket Overspark",    color: "#9b59b6", player: "Unknown",  cls: "Wizard (Divination)", race: "Gnome",    status: "Alive, crystallizing",            track: "Tieflings" },

const EVENTS = [
  // ===== ANCIENT HISTORY =====
  { id: "anc-01", ch: "0*",  act: "ancient", title: "The Rose of Creation",              detail: "Solution to the conflict between Gods of Destruction and Creation. The Raven Queen makes a Pact with Vecna to twin their worlds.", characters: [], track: "all", major: true, tags: ["cosmic", "gods"] },
  { id: "anc-02", ch: "0*",  act: "ancient", title: "The Death Pact -- Mardov and Vodram twinned", detail: "Shared domain of Death as cornerstone. 4 Zeniths created capable of wielding the power of the domain of Death.", characters: [], track: "all", major: true, tags: ["cosmic", "zeniths"] },
  { id: "anc-03", ch: "0*",  act: "ancient", title: "Vecna and Sabine Ra -- twin souls, divine jealousy", detail: "Original twin souls. Divine jealousy begins the cycle of betrayal.", characters: [], track: "all", major: false, tags: ["gods"] },
  { id: "anc-04", ch: "0*",  act: "ancient", title: "Sabine founds Circle of the Murder + Artificer's Guild", detail: "Ramses (Mordred) in the Circle; Xerxes in the Guild.", characters: [], track: "all", major: false, tags: ["factions"] },
  { id: "anc-05", ch: "0*",  act: "ancient", title: "Mordred forces lichdom on Sabine -- she crystallizes as Demi-Lich", detail: "Sabine Ra trapped in a phylactery. This sets up the campaign's opening.", characters: [], track: "all", major: true, tags: ["mordred", "undead"] },
  { id: "anc-06", ch: "0*",  act: "ancient", title: "Tygras's superweapon destroys Uma, creates the desert", detail: "Tygras sealed in Harvest's Zenith. Ranar Surefoot steals the Diadem of Dawn during the weapon's use.", characters: [], track: "all", major: true, tags: ["zeniths", "cosmic"] },
  { id: "anc-07", ch: "0*",  act: "ancient", title: "Asmodeus sealed in thirteen amulets by Kolyma", detail: "First and Last Curator sacrifices himself to activate Zeniths against Oblivion. Asmodeus scattered to guardians.", characters: [], track: "all", major: true, tags: ["asmodeus", "zeniths"] },
  { id: "anc-08", ch: "0*",  act: "ancient", title: "Covenants of Magic established; Mantles bestowed", detail: "Alabaster (Arcane), Ivy (Natural), Palladium (Divine), Crystalline (Mortal). No being except the Alabaster Seat may possess such power again.", characters: [], track: "all", major: false, tags: ["magic", "political"] },
  { id: "anc-09", ch: "0*",  act: "ancient", title: "Forgesworn order established; Thorin builds Warforged army", detail: "Thorin Bronzebeard creates the original Warforged. Sets up Daina's heritage.", characters: ["daina"], track: "all", major: false, tags: ["forgesworn", "warforged"] },

  { id: "rec-04", ch: "-?",   act: "recent", title: "Mordred possesses Finkle Hollingsworth at Forest's Zenith", detail: "Finkle is a Gnome (NOT Goblin). Mordred begins his scheme.", characters: [], track: "all", major: true, tags: ["mordred", "zeniths"] },

  { id: "a1-06", ch: "9",  act: "1", title: "First Prophecy (Ruth)", detail: "Ruth delivers the first of three prophecies guiding the party's destiny.", characters: [], track: "all", major: false, tags: ["prophecy", "ruth"] },

// ========== STATE ==========
const state = {
  activeCharacters: new Set(Object.keys(CHARACTERS)),
  activeAct: "all",
  searchQuery: "",
  selectedEvent: null,
  expandedEvents: new Set(),
};

// ========== RENDER SIDEBAR ==========
function renderSidebar() {
  const sb = document.getElementById("sidebar");
  let html = '<h3>Player Characters</h3>';

  for (const [id, c] of Object.entries(CHARACTERS)) {
    const on = state.activeCharacters.has(id);
    html += `<div class="char-toggle ${on ? '' : 'off'}" data-char="${id}">
      <span class="char-dot" style="background:${c.color}"></span>
      <span>${c.name.split(' ')[0]}</span>
      <span class="char-status">${c.track}</span>
    </div>`;
  }

  html += '<h3 style="margin-top:16px">Quick Filters</h3>';
  html += `<div class="char-toggle" data-filter="all"><span class="char-dot" style="background:var(--accent)"></span><span>All On</span></div>`;
  html += `<div class="char-toggle" data-filter="none"><span class="char-dot" style="background:var(--text-dim)"></span><span>All Off</span></div>`;
  html += `<div class="char-toggle" data-filter="tieflings"><span class="char-dot" style="background:var(--tieflings)"></span><span>Tieflings Track</span></div>`;
  html += `<div class="char-toggle" data-filter="dwarves"><span class="char-dot" style="background:var(--dwarves)"></span><span>Dwarves Track</span></div>`;

  sb.innerHTML = html;

  sb.querySelectorAll('[data-char]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.char;
      if (state.activeCharacters.has(id)) state.activeCharacters.delete(id);
      else state.activeCharacters.add(id);
      renderSidebar();
      renderTimeline();
    });
  });

  sb.querySelectorAll('[data-filter]').forEach(el => {
    el.addEventListener('click', () => {
      const f = el.dataset.filter;
      if (f === "all") state.activeCharacters = new Set(Object.keys(CHARACTERS));
      else if (f === "none") state.activeCharacters = new Set();
      else if (f === "tieflings") {
        state.activeCharacters = new Set(["brigit","sprocket","varis","fen","stalwart","randall","tesca","nyx"]);
      } else if (f === "dwarves") {
        state.activeCharacters = new Set(["bergs","daina","nocturnus"]);
      }
      renderSidebar();
      renderTimeline();
    });
  });
}

// ========== RENDER TIMELINE ==========
function getTrackColor(track) {
  switch(track) {
    case "tieflings": return "var(--tieflings)";
    case "dwarves":   return "var(--dwarves)";
    case "all":       return "var(--all-party)";
    default:          return "var(--text-dim)";
  }
}

function eventMatchesFilters(ev) {
  // Act filter
  if (state.activeAct !== "all" && ev.act !== state.activeAct) return false;

  // Search filter
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    const searchable = (ev.title + " " + ev.detail + " " + ev.tags.join(" ")).toLowerCase();
    if (!searchable.includes(q)) return false;
  }

  return true;
}

function eventHasActiveChar(ev) {
  if (ev.characters.length === 0) return true; // world events always show
  return ev.characters.some(c => state.activeCharacters.has(c));
}

  const main = document.getElementById("timeline");
  let html = '';

  const actNames = {
    ancient: ["Ancient History", "Before the campaign"],
    recent:  ["Recent Past",    "Decades before the campaign"],
    "1":     ["Act 1: The Awakening",   "Chapters 0-13"],
    "2":     ["Act 2: The Voyage",      "Chapters 14-40"],
    "3":     ["Act 3: The Split",       "Chapters 42-87"],
    "4":     ["Act 4: The Endgame",     "Chapters 87-136+"],
  };

  for (const ev of EVENTS) {
    if (!eventMatchesFilters(ev)) continue;

    const hasChar = eventHasActiveChar(ev);
    const dimmed = !hasChar;

    // Act header
    if (ev.act !== lastAct) {
      const [name, range] = actNames[ev.act] || [ev.act, ""];
      html += `<div class="act-header" id="act-${ev.act}">
        <h2>${name}</h2>
        <div class="act-range">${range}</div>
      </div>`;
      lastAct = ev.act;
    }

    const dotColor = getTrackColor(ev.track);
    const expanded = state.expandedEvents.has(ev.id);

    html += `<div class="event-row ${dimmed ? 'dimmed' : ''} ${expanded ? 'expanded' : ''} ${state.selectedEvent === ev.id ? 'highlight' : ''}"
                  data-id="${ev.id}" ${ev.jump ? `id="jump-${ev.jump}"` : ''}>
      <div class="event-chapter">${ev.ch}</div>
      <div class="event-dots">
        <div class="event-dot ${ev.major ? 'major' : ''}" style="border-color:${dotColor}; ${ev.major ? `background:${dotColor}` : ''}"></div>
        <div class="event-line"></div>
      </div>
      <div class="event-body">
        <div class="event-title">${ev.title}</div>
        <div class="event-detail">${ev.detail}</div>
        <div class="event-tags">
          ${ev.characters.filter(c => state.activeCharacters.has(c)).map(c =>
            `<span class="event-tag" style="color:${CHARACTERS[c].color}; border-color:${CHARACTERS[c].color}">${CHARACTERS[c].name.split(' ')[0]}</span>`
          ).join('')}
          ${ev.track !== 'all' ? `<span class="event-tag" style="color:${getTrackColor(ev.track)}; border-color:${getTrackColor(ev.track)}">${ev.track}</span>` : ''}
        </div>
      </div>
    </div>`;
  }

  main.innerHTML = html;

  // Event click handlers
  main.querySelectorAll('.event-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.id;
      if (state.expandedEvents.has(id)) {
        state.expandedEvents.delete(id);
      } else {
        state.expandedEvents.add(id);
      }
      state.selectedEvent = id;
      renderTimeline();
      showDetail(id);
    });
  });
}

// ========== DETAIL PANEL ==========
function showDetail(eventId) {
  const ev = EVENTS.find(e => e.id === eventId);
  if (!ev) return;

  const panel = document.getElementById("detailPanel");
  const title = document.getElementById("detailTitle");
  const body  = document.getElementById("detailBody");

  panel.classList.add("open");

  title.innerHTML = `<span style="color:${getTrackColor(ev.track)}">Ch ${ev.ch}</span> ${ev.title}
    <button class="close-btn" id="closeDetail">&times;</button>`;

  let html = '';

  // Description
  html += `<div class="detail-section">
    <h4>Details</h4>
    <p>${ev.detail}</p>
  </div>`;

  // Characters involved
  if (ev.characters.length > 0) {
    html += `<div class="detail-section"><h4>Characters Present</h4><ul>`;
    for (const cid of ev.characters) {
      const c = CHARACTERS[cid];
      if (!c) continue;
      html += `<li style="color:${c.color}"><span style="position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:${c.color}"></span> <strong>${c.name}</strong> -- ${c.cls} (${c.race})</li>`;
    }
    html += `</ul></div>`;
  }

  // Tags
  html += `<div class="detail-section"><h4>Tags</h4><p>${ev.tags.map(t => `<span class="event-tag" style="color:var(--accent);border-color:var(--accent)">${t}</span>`).join(' ')}</p></div>`;

  // Track
  html += `<div class="detail-section"><h4>Track</h4><p style="color:${getTrackColor(ev.track)}">${ev.track === 'all' ? 'Full Party' : ev.track.charAt(0).toUpperCase() + ev.track.slice(1) + ' Track'}</p></div>`;

  body.innerHTML = html;

  document.getElementById("closeDetail").addEventListener("click", () => {
    panel.classList.remove("open");
    state.selectedEvent = null;
    renderTimeline();
  });
}

// ========== CONTROLS ==========

// Act filter buttons
document.querySelectorAll('.filter-btn[data-act]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-act]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.activeAct = btn.dataset.act;
    renderTimeline();
  });
});

// Jump buttons
document.querySelectorAll('.jump-btn[data-jump]').forEach(btn => {
  btn.addEventListener('click', () => {
    // Reset act filter to all first
    document.querySelectorAll('.filter-btn[data-act]').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-act="all"]').classList.add('active');
    state.activeAct = "all";
    renderTimeline();
    setTimeout(() => {
      const target = document.getElementById(`jump-${btn.dataset.jump}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.classList.add('highlight');
        setTimeout(() => target.classList.remove('highlight'), 2000);
      }
    }, 50);
  });
});

// Search
document.getElementById("searchBox").addEventListener("input", (e) => {
  state.searchQuery = e.target.value;
  renderTimeline();
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById("detailPanel").classList.remove("open");
    state.selectedEvent = null;
    state.searchQuery = "";
    document.getElementById("searchBox").value = "";
    renderTimeline();
  }
  if (e.key === '/' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById("searchBox").focus();
  }
});

// ========== INIT ==========
renderSidebar();
renderTimeline();

</script>
</body>
</html>
